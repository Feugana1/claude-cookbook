name: Scan Sécu — Weekly Full

# Copy to .github/workflows/scan-secu-weekly.yml.
#
# Catch la dette qui se cache loin — le pre-commit --diff ne voit que le delta,
# ce cron scanne TOUT le repo hebdo (Trivy, npm audit, gitleaks history, SBOM,
# duplication, license, deps outdated). Résultats en Actions summary + issue
# si régression Tier 1.
#
# Trigger : lundi 06:00 UTC + workflow_dispatch manuel.
# Complète : scan-secu --diff pre-commit + code-reviewer sur PR.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scan-secu-full:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout with full history (gitleaks needs --all)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run scan-secu --full
        id: scan
        run: |
          bash scan-secu.sh --full 2>&1 | tee scan-secu-report.txt
        continue-on-error: true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: scan-secu-report-${{ github.run_number }}
          path: scan-secu-report.txt
          retention-days: 90

      - name: Extract summary for issue
        if: steps.scan.outcome == 'failure'
        id: summary
        run: |
          {
            echo 'REPORT<<EOF'
            grep -E '^\s*(PASS|FAIL|WARN|TOTAL|BLOCKED|READY|Top risks)' scan-secu-report.txt | tail -30
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create issue on tier-1 fail
        if: steps.scan.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.summary.outputs.REPORT }}`
            const title = `[scan-secu] Weekly full scan — Tier-1 regression ${new Date().toISOString().slice(0,10)}`
            const body = `Automated weekly \`bash scan-secu.sh --full\` detected Tier-1 or blocker regression.\n\n**Summary:**\n\`\`\`\n${report}\n\`\`\`\n\nRun \`bash scan-secu.sh --full\` locally + full artifact in workflow run [#${{ github.run_number }}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'scan-secu-weekly', state: 'open',
            })
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['scan-secu-weekly', 'security'],
              })
            }
