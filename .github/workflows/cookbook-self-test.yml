name: cookbook-self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck, JSON, frontmatter, leak-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck est préinstallé sur ubuntu-latest et signale aussi les erreurs de syntaxe.
      - name: shellcheck (errors only)
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck --severity=error --external-sources

      - name: JSON validity
        run: find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 jq empty

      - name: agents and skills frontmatter (strict YAML)
        run: ruby scripts/check-frontmatter.rb

      - name: no project-specific names (patterns in repository variable LEAK_PATTERN)
        env:
          LEAK_PATTERN: ${{ vars.LEAK_PATTERN }}
        run: bash scripts/leak-check.sh

  bootstrap-smoke:
    name: bootstrap installs, is idempotent, switches stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: init each stack, then re-run (must change nothing)
        run: |
          set -euo pipefail
          for stack in none adonisjs; do
            d=$(mktemp -d); (cd "$d" && git init -q)
            bash bootstrap-claude.sh "$d" --stack="$stack" > /dev/null
            out=$(bash bootstrap-claude.sh "$d" --stack="$stack" --update)
            echo "$out" | grep -E 'ajoutés : 0 · mis à jour : 0' || { echo "::error::bootstrap --stack=$stack is not idempotent"; echo "$out"; exit 1; }
          done

      - name: switching stack retires the old pack's files
        run: |
          set -euo pipefail
          d=$(mktemp -d); (cd "$d" && git init -q)
          bash bootstrap-claude.sh "$d" --stack=adonisjs > /dev/null
          bash bootstrap-claude.sh "$d" --stack=none --update > /dev/null
          [ ! -e "$d/.claude/hooks/dispatch-expert.sh" ] || { echo "::error::pack hook not retired"; exit 1; }
          [ -f "$d/.claude/agents/roles/security.md" ] || { echo "::error::replaced role not reinstalled"; exit 1; }

      - name: user-owned files survive --update
        run: |
          set -euo pipefail
          d=$(mktemp -d); (cd "$d" && git init -q)
          bash bootstrap-claude.sh "$d" --stack=none > /dev/null
          echo MY-LESSON >> "$d/docs/lessons.md"
          bash bootstrap-claude.sh "$d" --stack=none --update > /dev/null
          grep -q MY-LESSON "$d/docs/lessons.md" || { echo "::error::docs/lessons.md was overwritten"; exit 1; }

      - name: project-adapted managed files survive --update, --force overwrites them
        run: |
          set -euo pipefail
          d=$(mktemp -d); (cd "$d" && git init -q)
          bash bootstrap-claude.sh "$d" --stack=adonisjs > /dev/null
          echo '# MY-HOOK' >> "$d/.claude/hooks/dispatch-expert.sh"
          bash bootstrap-claude.sh "$d" --stack=adonisjs --update > /dev/null
          grep -q MY-HOOK "$d/.claude/hooks/dispatch-expert.sh" || { echo "::error::adapted hook overwritten by --update"; exit 1; }
          bash bootstrap-claude.sh "$d" --stack=none --update > /dev/null
          [ -f "$d/.claude/hooks/dispatch-expert.sh" ] || { echo "::error::adapted pack hook deleted on stack switch"; exit 1; }
          bash bootstrap-claude.sh "$d" --stack=adonisjs --update --force > /dev/null
          ! grep -q MY-HOOK "$d/.claude/hooks/dispatch-expert.sh" || { echo "::error::--force did not overwrite"; exit 1; }

      - name: paths in .cookbook-ignore are never added, updated or retired
        run: |
          set -euo pipefail
          d=$(mktemp -d); (cd "$d" && git init -q)
          mkdir -p "$d/.claude"
          printf '# refused by the project\ndocs/templates/*\n  scripts/statusline.sh  # graft statusline\n' > "$d/.claude/.cookbook-ignore"
          bash bootstrap-claude.sh "$d" --stack=adonisjs > /dev/null
          [ ! -e "$d/docs/templates" ] && [ ! -e "$d/scripts/statusline.sh" ] || { echo "::error::ignored path installed"; exit 1; }
          echo '# MINE' > "$d/scripts/statusline.sh"
          bash bootstrap-claude.sh "$d" --stack=adonisjs --update --force > /dev/null
          grep -qx '# MINE' "$d/scripts/statusline.sh" || { echo "::error::ignored path overwritten by --force"; exit 1; }

      - name: monolithic project scan-secu.sh is kept alone
        run: |
          set -euo pipefail
          d=$(mktemp -d); (cd "$d" && git init -q && printf '#!/bin/bash\necho mono\n' > scan-secu.sh)
          bash bootstrap-claude.sh "$d" --stack=adonisjs > /dev/null
          grep -q mono "$d/scan-secu.sh" || { echo "::error::project scan-secu.sh overwritten"; exit 1; }
          [ ! -d "$d/scripts/scan-secu.d" ] || { echo "::error::scan-secu.d installed next to a monolithic scan-secu.sh"; exit 1; }

      - name: inventory runs
        run: bash scripts/inventory.sh --json | jq -e .core.agents

  scan-secu-self:
    name: scan-secu.sh reaches a verdict on the cookbook itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run scan-secu.sh --diff (must complete without crash)
        run: |
          # Le cookbook n'a pas d'app back : des SKIP et des FAIL sont attendus.
          # Le contrôle porte sur l'arrivée au verdict, pas sur le code retour.
          set +e
          SECU_EXTRA_STEPS_DIRS=plugins/adonisjs/scripts/scan-secu.d \
            bash plugins/core/scripts/scan-secu.sh --diff 2>&1 | tee "$RUNNER_TEMP/scan-out.log"
          set -e
          grep -qE "READY TO PUSH|BLOCKED|NEEDS REVIEW|SHIP WITH DEBT|No changes to scan" "$RUNNER_TEMP/scan-out.log" \
            || { echo "::error::scan-secu did not reach a verdict (crashed mid-run?)"; exit 1; }
