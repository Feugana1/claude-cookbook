name: cookbook-self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-lint:
    name: Bash syntax + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on all .sh
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" 2>&1 || { echo "::error file=$f::bash syntax error"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $fail

      - name: shellcheck (errors only)
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=error --external-sources $(find . -name '*.sh' -not -path './.git/*')

  json-validate:
    name: JSON validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jq empty on all .json
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            jq empty "$f" 2>&1 || { echo "::error file=$f::invalid JSON"; fail=1; }
          done < <(find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*' -print0)
          exit $fail

  frontmatter:
    name: Agents and skills frontmatter (strict YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ruby scripts/check-frontmatter.rb

  bootstrap-smoke:
    name: bootstrap installs, is idempotent, switches stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: init each stack, then re-run (must change nothing)
        run: |
          set -euo pipefail
          for stack in none adonisjs; do
            d=$(mktemp -d); (cd "$d" && git init -q)
            bash bootstrap-claude.sh "$d" --stack="$stack" > /dev/null
            out=$(bash bootstrap-claude.sh "$d" --stack="$stack" --update)
            echo "$out" | grep -E 'ajoutés : 0 · mis à jour : 0' || { echo "::error::bootstrap --stack=$stack is not idempotent"; echo "$out"; exit 1; }
          done

      - name: switching stack retires the old pack's files
        run: |
          set -euo pipefail
          d=$(mktemp -d); (cd "$d" && git init -q)
          bash bootstrap-claude.sh "$d" --stack=adonisjs > /dev/null
          bash bootstrap-claude.sh "$d" --stack=none --update > /dev/null
          [ ! -e "$d/.claude/hooks/dispatch-expert.sh" ] || { echo "::error::pack hook not retired"; exit 1; }
          [ -f "$d/.claude/agents/roles/security.md" ] || { echo "::error::replaced role not reinstalled"; exit 1; }

      - name: user-owned files survive --update
        run: |
          set -euo pipefail
          d=$(mktemp -d); (cd "$d" && git init -q)
          bash bootstrap-claude.sh "$d" --stack=none > /dev/null
          echo MY-LESSON >> "$d/docs/lessons.md"
          bash bootstrap-claude.sh "$d" --stack=none --update > /dev/null
          grep -q MY-LESSON "$d/docs/lessons.md" || { echo "::error::docs/lessons.md was overwritten"; exit 1; }

      - name: inventory runs
        run: bash scripts/inventory.sh --json | jq -e .core.agents

  scan-secu-self:
    name: scan-secu.sh reaches a verdict on the cookbook itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run scan-secu.sh --diff (must complete without crash)
        run: |
          # Le cookbook n'a pas d'app back : des SKIP et des FAIL sont attendus.
          # Le contrôle porte sur l'arrivée au verdict, pas sur le code retour.
          set +e
          SECU_EXTRA_STEPS_DIRS=plugins/adonisjs/scripts/scan-secu.d \
            bash plugins/core/scripts/scan-secu.sh --diff 2>&1 | tee "$RUNNER_TEMP/scan-out.log"
          set -e
          grep -qE "READY TO PUSH|BLOCKED|NEEDS REVIEW|SHIP WITH DEBT|No changes to scan" "$RUNNER_TEMP/scan-out.log" \
            || { echo "::error::scan-secu did not reach a verdict (crashed mid-run?)"; exit 1; }

  leak-check:
    name: No project-specific names in generic files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: leak-check (patterns live in the repository variable LEAK_PATTERN, not in the repo)
        env:
          LEAK_PATTERN: ${{ vars.LEAK_PATTERN }}
        run: bash scripts/leak-check.sh
